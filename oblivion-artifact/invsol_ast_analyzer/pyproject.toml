[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invsol-ast-analyzer"
version = "0.1.0"
description = "AST Analyzer for InvSol (mini-project). Parses Solidity AST and emits a normalized, loop-aware JSON IR."
authors = [{name = "Your Name"}]
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.6.0",
    "jsonschema>=4.22.0",
    "rich>=13.7.0"
]

[project.scripts]
invsol-ast = "invsol_ast.cli:app"